name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # Reused by the release workflow, so an image is only published if CI passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      # "--group" (dependency groups of pyproject.toml) needs pip 25.1 or newer.
      - name: Install the development tools
        run: |
          python -m pip install pip==26.3
          python -m pip install --group dev
      - name: ruff check
        run: python -m ruff check --output-format=github api tests
      - name: ruff format
        run: python -m ruff format --check --diff api tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The project (editable) brings its [project] dependencies, "--group dev" the
      # development tools. "--group" needs pip 25.1 or newer.
      - name: Install dependencies
        run: |
          python -m pip install pip==26.3
          python -m pip install -e . --group dev
          python -m pip check
      - name: Run the tests (fails below 100% coverage)
        run: python -m pytest -W error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: protoncalendar-ro-api:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name api -p 8080:80 \
            -e TIMEZONE=Europe/Athens -e X_API_KEY=ci-smoke-test \
            -e PROTON_CALENDAR_URL=https://calendar.proton.me/api/calendar/v1/url/ci-smoke-test/calendar.ics \
            "$IMAGE"
          trap 'docker logs api' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health

          echo "Requests without an API key are rejected"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/events/11-Dec-2025)" = 401

          echo "Runs as an unprivileged user"
          test "$(docker exec api id -u)" = 10001

          echo "Has time zone data"
          docker exec api python -c "import zoneinfo; zoneinfo.ZoneInfo('Europe/Athens')"

          echo "Contains no secrets, sources or dev tooling"
          test "$(docker exec api ls -A /app | LC_ALL=C sort | tr '\n' ' ')" = ".venv api "
          # (an "if", because "set -e" ignores failures of commands negated with "!")
          if docker exec api python -c "import pytest" 2>/dev/null; then
            echo "::error::Dev dependencies were installed in the image."
            exit 1
          fi

          echo "Becomes healthy"
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' api)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
