name: main

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  cd-publish:
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.project.outputs.version }}
    env:
      IMAGE: docker.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Read the project metadata
        id: project
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import os
          import tomllib

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          image, version = os.environ["IMAGE"], project["version"]
          minor = version.rsplit(".", 1)[0]
          print(f"version={version}")
          print(f"tags={image}:{version},{image}:{minor},{image}:latest")
          print(f"description={project['description'].strip()}")
          EOF

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.project.outputs.tags }}
          provenance: mode=max
          sbom: true

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          short-description: ${{ steps.project.outputs.description }}

  cd-release:
    needs: cd-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.cd-publish.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [v$VERSION]" '
            index($0, "## [") == 1 { section = index($0, heading) == 1; next }
            section
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no '## [v$VERSION]' section."
            exit 1
          fi
          gh release create "$VERSION" --verify-tag --title "v$VERSION" --notes-file "$notes"
