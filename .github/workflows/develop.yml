name: develop

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install the development tools
        run: |
          python -m pip install pip==26.3
          python -m pip install --group dev
      - name: ruff check
        run: python -m ruff check --output-format=github api tests
      - name: ruff format
        run: python -m ruff format --check --diff api tests

  ci-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install pip==26.3
          python -m pip install -e . --group dev
          python -m pip check
      - name: Run the tests
        run: python -m pytest -W error

  ci-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t protoncalendar-ro-api .
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name api -p 8080:80 \
            -e TIMEZONE=Europe/Athens -e X_API_KEY=ci-smoke-test \
            -e PROTON_CALENDAR_URL=https://calendar.proton.me/api/calendar/v1/url/ci-smoke-test/calendar.ics \
            protoncalendar-ro-api
          trap 'docker logs api' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health

          echo "Requests without an API key are rejected"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/events/11-Dec-2025)" = 401

          echo "Runs as an unprivileged user"
          test "$(docker exec api id -u)" = 10001

          echo "Has time zone data"
          docker exec api python -c "import zoneinfo; zoneinfo.ZoneInfo('Europe/Athens')"

          echo "Contains no secrets, sources or dev tooling"
          test "$(docker exec api ls -A /app | LC_ALL=C sort | tr '\n' ' ')" = ".venv api "
          if docker exec api python -c "import pytest" 2>/dev/null; then
            echo "::error::Dev dependencies were installed in the image."
            exit 1
          fi

          echo "Becomes healthy"
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' api)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy

  ci-pull-request:
    needs: [ci-lint, ci-test, ci-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open the pull request to main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "::error::Version $VERSION is not on develop."
            exit 1
          fi

          body="$RUNNER_TEMP/body.md"
          awk -v heading="## [v$VERSION]" '
            index($0, "## [") == 1 { section = index($0, heading) == 1; next }
            section
          ' CHANGELOG.md > "$body"
          if ! grep -q '[^[:space:]]' "$body"; then
            echo "::error::CHANGELOG.md has no '## [v$VERSION]' section."
            exit 1
          fi

          pr="$(gh pr list --base main --head develop --json number --jq '.[].number')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Release $VERSION" --body-file "$body"
          else
            gh pr create --base main --head develop --title "Release $VERSION" --body-file "$body"
          fi
